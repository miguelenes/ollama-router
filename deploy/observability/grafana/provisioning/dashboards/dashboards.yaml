apiVersion: 1

providers:
  - name: ollama-router
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      # Product JSON at this path root stays in General (home is still
      # ollama-router.json). Nested stack/*.json become folder "stack".
      foldersFromFilesStructure: true
