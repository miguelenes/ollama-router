global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          cluster: compose

  - job_name: ollama-router
    metrics_path: /metrics
    static_configs:
      - targets: ["router:11434"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          cluster: compose
          namespace: compose

  # Compose mock CPU/GPU only. Do not copy this job to production (no :11436 scrape).
  - job_name: ollama-node-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["mock-cpu:11436"]
        labels:
          node: cpu
      - targets: ["mock-gpu:11436"]
        labels:
          node: gpu

  # Compose stack mixins (Loki ingest / Alertmanager). Not a production node-agent job.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          cluster: compose
          namespace: compose

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          cluster: compose
