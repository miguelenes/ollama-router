# Canned mock inventory for `task compose:mock` (mock-cpu / mock-gpu).
# Native local-dev uses deploy/fleet.local.yaml (`task dev`).
version: 1
nodes:
  - id: cpu
    url: http://mock-cpu:11434
    labels: [cpu]
  - id: gpu
    url: http://mock-gpu:11434
    labels: [gpu]
    capacity:
      vram_gb: 24
      gpus: 1
