# Optional canned CPU + GPU Ollama mock fleet plus local observability.
# Use `task compose:mock` when host Ollama is not available.
# Host ports bind loopback only. 11435 avoids colliding with a local Ollama on :11434.
# The router process needs no GPU. Observability is on by default (no compose profile).
# Do not run at the same time as `task compose:up` (same Grafana/Prometheus ports).
#
# The Grafana/Alloy/Loki/Alertmanager quartet (and grafana-data) is shared with
# compose.yaml via `include` (deploy/observability/compose.stack.yaml).
# Prometheus stays here because the mock stack scrapes the compose `router`.
include:
  - path: ./observability/compose.stack.yaml

services:
  mock-cpu:
    build:
      context: ..
      dockerfile: Dockerfile
      target: mock
    environment:
      MOCK_ROLE: cpu
      OLLAMA_MOCK_PORT: "11434"
      CAPACITY_PORT: "11436"

  mock-gpu:
    build:
      context: ..
      dockerfile: Dockerfile
      target: mock
    environment:
      MOCK_ROLE: gpu
      OLLAMA_MOCK_PORT: "11434"
      CAPACITY_PORT: "11436"

  router:
    image: ollama-router:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: router
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ./fleet.yaml:/etc/ollama-router/fleet.yaml:ro
    environment:
      OLLAMA_ROUTER_FLEET: /etc/ollama-router/fleet.yaml
      OLLAMA_ROUTER_HOST: 0.0.0.0
      OLLAMA_ROUTER_PORT: "11434"
      OLLAMA_ROUTER_AUTO_PULL_ON_MISS: "true"
      RUST_LOG: ollama_router=info
    depends_on:
      - mock-cpu
      - mock-gpu

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.mock.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
    tmpfs:
      - /prometheus
    user: "0"
    depends_on:
      - router
      - alloy
      - alertmanager
      - loki
