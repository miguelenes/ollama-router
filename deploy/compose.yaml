# Local Grafana / Prometheus / Loki / Alloy / Alertmanager.
# Native `task dev` runs the router on the host (:11435 → host Ollama :11434).
# This file does not start mock-cpu, mock-gpu, or a router container.
# Host ports bind loopback only. Observability is on by default (no compose profile).
# Optional canned fleet: `task compose:mock` (do not run both stacks at once).
#
# The Grafana/Alloy/Loki/Alertmanager quartet (and grafana-data) is shared with
# compose.mock.yaml via `include` (deploy/observability/compose.stack.yaml).
# Prometheus stays here because the host stack scrapes the native router.
include:
  - path: ./observability/compose.stack.yaml

services:
  prometheus:
    image: prom/prometheus:v3.13.2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
    tmpfs:
      - /prometheus
    user: "0"
    depends_on:
      - alloy
      - alertmanager
      - loki
