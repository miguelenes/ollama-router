# Tunables overlay for the Swarm stack (OLLAMA_ROUTER_CONFIG).
# This file is the live stack config (`ollama-router-config`). Keep cloud
# providers **false** until guest curls for enroll + zrok + agent package succeed.
# Never commit tokens, enable keys, or fleet inventory (`nodes:` is forbidden).
#
# Cloud credentials: Swarm secrets -> env (see ollama-router.stack.yml).
# Kill switch: OLLAMA_ROUTER_CLOUD_ENABLED=false at stack deploy, or
# POST /router/v1/cloud/halt (admin bearer) to terminate owned cloud GPUs.
#
# Guest enroll uses Tailscale Funnel HTTPS 443 path `/router` (Woodpecker keeps
# `/`). Funnel strips `--set-path=/router`, so the public enroll URL has an extra
# `/router` prefix. MagicDNS `ollama-router.bicorn-beta.ts.net:11434` is
# tailnet-only — RunPod guests cannot use it.
# Load tests use ROUTER_URL only — never aim generate at *.proxy.runpod.net.

job_store_path: /var/lib/ollama-router/model-operations.sqlite3

policy:
  auto_pull_on_miss: true
  model_warm_enabled: false
  saturation_wait_seconds: 0

tunnel:
  # Funnel HTTPS 8443 → zrok controller :18080 (not loopback, not MagicDNS-only).
  # OpenZiti :3022 still needs a direct TLS path (Funnel TCP 10000); do not HTTP-proxy it.
  api_endpoint: https://desktop.bicorn-beta.ts.net:8443
  enable_token_env: ZROK_ENABLE_TOKEN
  access_bind: "127.0.0.1"

verda:
  enabled: false
  auto_scale: true
  auto_scale_min_instances: 0
  auto_scale_max_instances: 2
  idle_scale_down_enabled: true
  idle_timeout_seconds: 90
  idle_grace_after_create_seconds: 300
  min_lifetime_seconds: 0
  ensure_on_startup: false
  destroy_on_shutdown: true
  enroll_url: https://desktop.bicorn-beta.ts.net/router/router/v1/nodes/enroll
  # max_spot_price_per_hour: 0.50

runpod:
  enabled: false
  interruptible: true
  on_demand_fallback: false
  auto_scale: true
  auto_scale_min_instances: 0
  auto_scale_max_instances: 2
  idle_scale_down_enabled: true
  idle_timeout_seconds: 90
  idle_grace_after_create_seconds: 300
  min_lifetime_seconds: 0
  destroy_on_shutdown: true
  # Default image is ollama/ollama:latest (override to pin a digest or legacy PyTorch).
  image: ollama/ollama:latest
  # template_id: null
  preferred_data_centers:
    - EU-NL-1
    - EU-FR-1
    - EU-CZ-1
    - EU-RO-1
    - EU-SE-1
  enroll_url: https://desktop.bicorn-beta.ts.net/router/router/v1/nodes/enroll
  # Guest-reachable agent .deb (GitHub v0.1.0 assets 404). After `task agent:release:deb`:
  # agent_package_url: https://desktop.bicorn-beta.ts.net/agent/ollama-node-agent_0.1.0_amd64.deb
  # max_price_per_hour: 0.50
