# ollama-router Swarm stack — fleet local registry only.
#
# Deployed with:
#   docker stack deploy -c deploy/swarm/ollama-router.stack.yml ollama-router
#
# Image refs here must stay on the fleet local registry; CI greps this
# directory and fails if a `ghcr.io` reference sneaks in (spec:
# swarmnet-local-deploy "Stack image refs are local-registry only").
#
# Interpolation (from the deploy step's environment, never committed):
#   DEPLOY_REGISTRY  pull host for swarm nodes (default 127.0.0.1:5005; set to
#                    the registry LAN IP when nodes pull over the network)
#   ROUTER_TAG       image tag (default latest; the CI deploy job pins the
#                    git SHA tag, e.g. sha-8cbc365)
#   OLLAMA_ROUTER_ADMIN_TOKEN, VERDA_*, RUNPOD_API_KEY, zrok env
#                    host environment / Swarm secrets (see README.md)
#
# One router replica only: FleetState file lock is same-host only, two
# replicas can double-create cloud GPUs. Do not scale this service.

services:
  router:
    image: ${DEPLOY_REGISTRY:-127.0.0.1:5005}/ollama-router:${ROUTER_TAG:-latest}
    ports:
      - "11434:11434" # Ollama-compatible listen (override with OLLAMA_ROUTER_HOST/PORT env)
    # Swarm secrets -> env (never commit values; create with docker secret create).
    command:
      - /bin/sh
      - -c
      - |
        if [ -f /run/secrets/ollama-router-admin-token ]; then
          export OLLAMA_ROUTER_ADMIN_TOKEN="$$(cat /run/secrets/ollama-router-admin-token)"
        fi
        if [ -f /run/secrets/verda-client-id ]; then
          export VERDA_CLIENT_ID="$$(cat /run/secrets/verda-client-id)"
        fi
        if [ -f /run/secrets/verda-client-secret ]; then
          export VERDA_CLIENT_SECRET="$$(cat /run/secrets/verda-client-secret)"
        fi
        if [ -f /run/secrets/runpod-api-key ]; then
          export RUNPOD_API_KEY="$$(cat /run/secrets/runpod-api-key)"
        fi
        if [ -f /run/secrets/zrok-enable-token ]; then
          export ZROK_ENABLE_TOKEN="$$(cat /run/secrets/zrok-enable-token)"
        fi
        exec ollama-router serve
    environment:
      OLLAMA_ROUTER_FLEET: /etc/ollama-router/fleet.yaml
      OLLAMA_ROUTER_CONFIG: /etc/ollama-router/config.yaml
      # Cloud + zrok credentials: set at `docker stack deploy` from the host env
      # (Woodpecker repo secrets) or mount optional Swarm secrets by extending
      # this service's `secrets:` list locally — never commit values.
      VERDA_CLIENT_ID: ${VERDA_CLIENT_ID:-}
      VERDA_CLIENT_SECRET: ${VERDA_CLIENT_SECRET:-}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      ZROK_ENABLE_TOKEN: ${ZROK_ENABLE_TOKEN:-}
      OLLAMA_ROUTER_ZROK_API_ENDPOINT: ${OLLAMA_ROUTER_ZROK_API_ENDPOINT:-}
      OLLAMA_ROUTER_ID: ${OLLAMA_ROUTER_ID:-}
    volumes:
      # Durable FleetState + model-operations SQLite live under /var/lib/ollama-router.
      - ollama-router-state:/var/lib/ollama-router
    configs:
      # GitOps inventory (deploy/fleet.swarm.yaml); CI never writes fleet.yaml.
      - source: ollama-router-fleet
        target: /etc/ollama-router/fleet.yaml
        mode: 0444
      # Optional tunables overlay (defaults in router.defaults.yaml apply when absent).
      - source: ollama-router-config
        target: /etc/ollama-router/config.yaml
        mode: 0440
    secrets:
      - ollama-router-admin-token
    deploy:
      replicas: 1
      # Host Tailscale + LAN reachability to :11435 backends (not NAS overlay).
      placement:
        constraints:
          - node.hostname == desktop-pc
      restart_policy:
        condition: any
        delay: 5s
        window: 120s
      update_config:
        # Never run two replicas sharing FleetState: stop the old one first.
        order: stop-first
        failure_action: rollback
        delay: 10s

volumes:
  ollama-router-state:

configs:
  ollama-router-fleet:
    file: ../fleet.swarm.yaml
  ollama-router-config:
    file: router.config.example.yaml
    # Do not commit live tunables here; ship a placeholder template instead
    # (see deploy/swarm/README.md). If no overlay is wanted, remove this
    # config and the router's `configs:` entry.

secrets:
  ollama-router-admin-token:
    # Required for admin API. Create: printf '%s' "$ADMIN_TOKEN" | docker secret create ollama-router-admin-token -
    external: true
  # Optional (extend service `secrets:` + entrypoint when preferring Swarm secrets):
  # verda-client-id, verda-client-secret, runpod-api-key, zrok-enable-token
