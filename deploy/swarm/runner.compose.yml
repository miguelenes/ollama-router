# Optional self-hosted runner for the ollama-router fleet jobs.
#
# The deploy-swarm.yml jobs run on labels `self-hosted,linux,ollama-router`.
# If the swarmnet host already runs a self-hosted runner, simply add the
# `ollama-router` label to it and skip this file. Otherwise register a
# dedicated runner container with this profile:
#
#   cd deploy/swarm
#   cp runner.env.example runner.env          # fill in, never commit
#   docker compose --profile runner --env-file runner.env up -d
#
# Requirements on the runner host:
#   - Docker daemon configured with the fleet registry as an insecure
#     registry (see README.md) so `docker push` to FLEET_REGISTRY works.
#   - The mounted docker socket must be the Swarm manager's socket if you
#     want `docker stack deploy` to work from CI (SWARM_DEPLOY_ENABLED).
#   - `network_mode: host` (Linux) so the container reaches the host
#     registry at 127.0.0.1:5005 and the Swarm API on the loopback.
#
# Env vars (runner.env, all required):
#   REPO_URL        https://github.com/miguelenes/ollama-router
#   ACCESS_TOKEN    fine-grained PAT with "Administration: self-hosted runners"
#   RUNNER_NAME     e.g. nas-ollama-router
#   RUNNER_LABELS   self-hosted,linux,ollama-router

services:
  runner:
    image: myoung34/github-runner:latest # pin to the actions/runner release you track
    container_name: ollama-router-runner
    profiles: ["runner"]
    restart: unless-stopped
    network_mode: host
    environment:
      REPO_URL: ${REPO_URL:?set REPO_URL}
      ACCESS_TOKEN: ${ACCESS_TOKEN:?set ACCESS_TOKEN (never commit)}
      RUNNER_NAME: ${RUNNER_NAME:-ollama-router-runner}
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,linux,ollama-router}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/home/runner/_work
    security_opt:
      - label:disable # SELinux/AppArmor environments

volumes:
  runner-work:
