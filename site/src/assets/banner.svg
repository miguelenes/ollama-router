<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">ollama-router</title>
  <desc id="desc">One URL, many Ollama hosts. CPU-only fleet proxy with optional Verda Tailscale GPUs.</desc>
  <defs>
    <style>
      .bg { fill: #070b10; }
      .grid { stroke: #2dd4bf; stroke-opacity: 0.07; }
      .hair { stroke: #1c2733; }
      .fg { fill: #e8eef4; }
      .muted { fill: #8b98a5; }
      .teal { fill: #2dd4bf; stroke: #2dd4bf; }
      .ember { fill: #f59e0b; stroke: #f59e0b; }
      .orbit { stroke: #2dd4bf; stroke-opacity: 0.22; fill: none; }
      .orbit-ember { stroke: #f59e0b; stroke-opacity: 0.18; fill: none; }
      .spoke { stroke: #2dd4bf; stroke-opacity: 0.38; fill: none; }
      .spoke-ember { stroke: #f59e0b; stroke-opacity: 0.42; fill: none; }
      .chip-bg { fill: rgba(45, 212, 191, 0.08); stroke: rgba(45, 212, 191, 0.38); }
      .rule { stroke: #2dd4bf; }
      .feed { stroke: #2dd4bf; stroke-opacity: 0.28; fill: none; }
      .hub-ring { stroke: #2dd4bf; stroke-opacity: 0.55; fill: none; }
      #glowTeal stop:first-child { stop-color: #2dd4bf; }
      #glowEmber stop:first-child { stop-color: #f59e0b; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f4f1ea; }
        .grid { stroke: #0f766e; stroke-opacity: 0.1; }
        .hair { stroke: #d4cdc2; }
        .fg { fill: #12161c; }
        .muted { fill: #5c6770; }
        .teal { fill: #0f766e; stroke: #0f766e; }
        .ember { fill: #b45309; stroke: #b45309; }
        .orbit { stroke: #0f766e; stroke-opacity: 0.28; }
        .orbit-ember { stroke: #b45309; stroke-opacity: 0.22; }
        .spoke { stroke: #0f766e; stroke-opacity: 0.42; }
        .spoke-ember { stroke: #b45309; stroke-opacity: 0.45; }
        .chip-bg { fill: rgba(15, 118, 110, 0.08); stroke: rgba(15, 118, 110, 0.32); }
        .rule { stroke: #0f766e; }
        .feed { stroke: #0f766e; stroke-opacity: 0.32; }
        .hub-ring { stroke: #0f766e; stroke-opacity: 0.6; }
        #glowTeal stop:first-child { stop-color: #0f766e; }
        #glowEmber stop:first-child { stop-color: #b45309; }
      }
    </style>
    <radialGradient id="glowTeal" cx="22%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmber" cx="82%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="grid" d="M 40 0 L 0 0 0 40" fill="none" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="420"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect class="bg" width="1280" height="420"/>
    <rect width="1280" height="420" fill="url(#glowTeal)"/>
    <rect width="1280" height="420" fill="url(#glowEmber)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>

    <line class="hair" x1="0" y1="36" x2="1280" y2="36" stroke-width="1"/>
    <line class="hair" x1="0" y1="384" x2="1280" y2="384" stroke-width="1"/>

    <line class="rule" x1="72" y1="118" x2="156" y2="118" stroke-width="2"/>
    <text class="muted" x="72" y="108" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4.2">FLEET PROXY</text>
    <text class="fg" x="72" y="196" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="600" letter-spacing="-1.2">ollama-router</text>
    <text class="muted" x="72" y="242" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="3.4">ONE URL &#183; MANY OLLAMA HOSTS</text>

    <g transform="translate(72, 278)">
      <rect class="chip-bg" width="168" height="32" rx="16" fill="none" stroke-width="1"/>
      <circle class="teal" cx="18" cy="16" r="4"/>
      <text class="fg" x="34" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.6">PROXY :11434</text>
    </g>
    <g transform="translate(252, 278)">
      <rect class="chip-bg" width="148" height="32" rx="16" fill="none" stroke-width="1"/>
      <circle class="ember" cx="18" cy="16" r="4"/>
      <text class="fg" x="34" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.6">VERDA SPOT</text>
    </g>

    <path class="feed" d="M 430 294 C 560 294, 640 210, 825 210" stroke-width="1.25" stroke-dasharray="3 6"/>

    <g transform="translate(1000 210)" filter="url(#soft)">
      <circle class="orbit" r="72" stroke-width="1" stroke-dasharray="2 6"/>
      <circle class="orbit" r="118" stroke-width="1"/>
      <circle class="orbit-ember" r="168" stroke-width="1" stroke-dasharray="1 8"/>

      <line class="spoke" x1="0" y1="0" x2="112.8" y2="41" stroke-width="1.25"/>
      <line class="spoke" x1="0" y1="0" x2="-91.9" y2="77.1" stroke-width="1.25"/>
      <line class="spoke" x1="0" y1="0" x2="-41" y2="-112.8" stroke-width="1.25"/>
      <line class="spoke" x1="0" y1="0" x2="67.7" y2="-98.3" stroke-width="1"/>
      <line class="spoke-ember" x1="0" y1="0" x2="169" y2="-45.3" stroke-width="1.25"/>
      <line class="spoke-ember" x1="0" y1="0" x2="-15.3" y2="174.3" stroke-width="1.25"/>
      <line class="spoke-ember" x1="0" y1="0" x2="-164.4" y2="-59.9" stroke-width="1.25"/>

      <circle class="teal" cx="112.8" cy="41" r="6.5"/>
      <circle class="teal" cx="-91.9" cy="77.1" r="5.5"/>
      <circle class="teal" cx="-41" cy="-112.8" r="5.5"/>
      <circle class="teal" cx="67.7" cy="-98.3" r="4" fill-opacity="0.85"/>
      <circle class="ember" cx="169" cy="-45.3" r="7.5"/>
      <circle class="ember" cx="-15.3" cy="174.3" r="6.5"/>
      <circle class="ember" cx="-164.4" cy="-59.9" r="7"/>

      <circle class="hub-ring" r="18" stroke-width="1.5"/>
      <circle class="teal" r="7.5"/>
    </g>
  </g>
</svg>
