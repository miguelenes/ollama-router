<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ollama-router mark">
  <defs>
    <style>
      .bg { fill: #070b10; }
      .teal { fill: #2dd4bf; stroke: #2dd4bf; }
      .ember { fill: #f59e0b; stroke: #f59e0b; }
      .orbit { stroke: #2dd4bf; stroke-opacity: 0.28; fill: none; }
      .orbit-ember { stroke: #f59e0b; stroke-opacity: 0.22; fill: none; }
      .spoke { stroke: #2dd4bf; stroke-opacity: 0.45; fill: none; }
      .spoke-ember { stroke: #f59e0b; stroke-opacity: 0.5; fill: none; }
      .hub-ring { stroke: #2dd4bf; stroke-opacity: 0.6; fill: none; }
      .edge { stroke: #1c2733; fill: none; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f4f1ea; }
        .teal { fill: #0f766e; stroke: #0f766e; }
        .ember { fill: #b45309; stroke: #b45309; }
        .orbit { stroke: #0f766e; stroke-opacity: 0.32; }
        .orbit-ember { stroke: #b45309; stroke-opacity: 0.26; }
        .spoke { stroke: #0f766e; stroke-opacity: 0.48; }
        .spoke-ember { stroke: #b45309; stroke-opacity: 0.52; }
        .hub-ring { stroke: #0f766e; stroke-opacity: 0.65; }
        .edge { stroke: #d4cdc2; }
      }
    </style>
  </defs>
  <rect class="bg" width="128" height="128" rx="28"/>
  <rect class="edge" x="0.5" y="0.5" width="127" height="127" rx="27.5" stroke-width="1"/>
  <g transform="translate(64 64)">
    <circle class="orbit" r="22" stroke-width="1" stroke-dasharray="2 4"/>
    <circle class="orbit-ember" r="36" stroke-width="1"/>
    <line class="spoke" x1="0" y1="0" x2="19" y2="11" stroke-width="1.25"/>
    <line class="spoke" x1="0" y1="0" x2="-16" y2="15" stroke-width="1.25"/>
    <line class="spoke" x1="0" y1="0" x2="-8" y2="-20" stroke-width="1.25"/>
    <line class="spoke-ember" x1="0" y1="0" x2="34" y2="-12" stroke-width="1.25"/>
    <line class="spoke-ember" x1="0" y1="0" x2="-4" y2="36" stroke-width="1.25"/>
    <line class="spoke-ember" x1="0" y1="0" x2="-33" y2="-14" stroke-width="1.25"/>
    <circle class="teal" cx="19" cy="11" r="3.2"/>
    <circle class="teal" cx="-16" cy="15" r="2.6"/>
    <circle class="teal" cx="-8" cy="-20" r="2.6"/>
    <circle class="ember" cx="34" cy="-12" r="3.6"/>
    <circle class="ember" cx="-4" cy="36" r="3.2"/>
    <circle class="ember" cx="-33" cy="-14" r="3.4"/>
    <circle class="hub-ring" r="8" stroke-width="1.4"/>
    <circle class="teal" r="3.4"/>
  </g>
