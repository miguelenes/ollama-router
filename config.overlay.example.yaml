# ollama-router — optional tunables overlay.
#
# Point OLLAMA_ROUTER_CONFIG at this file (or a copy) to override
# committed router.defaults.yaml. Permanent membership is
# OLLAMA_ROUTER_FLEET (see deploy/fleet.yaml). Do not add a top-level
# `nodes:` key here — that is a hard config error.
#
# Verda is the only cloud provider. Thunder / RunPod sections are rejected.

# policy:
#   sticky_affinity: false
#   default_max_inflight: 2
#   saturated_retry_after_seconds: 30
#   provision_retry_after_seconds: 30
#   # Opt-in: enqueue a fleet pull when generate/chat/embed miss a model.
#   # Placement-gated (static VRAM/class). Default in router.defaults.yaml is false.
#   auto_pull_on_miss: true
#   pull_miss_retry_after_seconds: 10
#   auto_pull_wait_seconds: 0

# desired_model_tiers:
#   - models:
#       - qwen3-embedding:8b
#       - moondream
#       - llama3.2:1b
#     min_vram_gb: 0

# verda:
#   auto_scale: true
#   auto_scale_min_instances: 0
#   auto_scale_max_instances: 2
#   ssh_key_name: ollama-router
#   startup_script_name: ollama-router-agent-init
#   # Reachable enroll URL for Verda spots (not 0.0.0.0). Tokens stay in env:
#   # ZROK_ENABLE_TOKEN, OLLAMA_ROUTER_ADMIN_TOKEN (names below).
#   enroll_url: http://router.example:11435
#   zrok_enable_token_env: ZROK_ENABLE_TOKEN
#   enroll_token_env: OLLAMA_ROUTER_ADMIN_TOKEN
#   # Optional: pin a .deb/tarball instead of the GitHub release for this version.
#   # agent_package_url: https://example.invalid/ollama-node-agent_0.1.0_amd64.deb
#   # Inclusive VRAM window; 80 GB excludes H200-class cards.
#   min_vram_gb: 8
#   max_vram_gb: 80
#   # Optional fallback for demand-scale logs/metrics. FleetState
#   # verda_spot_price_per_hour wins when persisted.
#   demand_scale_price_per_hour: 0.30

# Self-hosted zrok controller the router `access private` frontends talk to.
# Enable token stays in the env named below — never a YAML literal.
# tunnel:
#   api_endpoint: http://127.0.0.1:18080
#   enable_token_env: ZROK_ENABLE_TOKEN
#   access_bind: "127.0.0.1"
