# ollama-router — optional tunables overlay.
#
# Point OLLAMA_ROUTER_CONFIG at this file (or a copy) to override
# committed router.defaults.yaml. Permanent membership is
# OLLAMA_ROUTER_FLEET (see deploy/fleet.yaml). Do not add a top-level
# `nodes:` key here — that is a hard config error.
#
# Verda is the only cloud provider. Thunder / RunPod sections are rejected.

# policy:
#   sticky_affinity: false
#   default_max_inflight: 2
#   saturated_retry_after_seconds: 30
#   provision_retry_after_seconds: 30

# desired_model_tiers:
