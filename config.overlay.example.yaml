# ollama-router — optional tunables overlay.
#
# Point OLLAMA_ROUTER_CONFIG at this file (or a copy) to override
# committed router.defaults.yaml. Permanent membership is
# OLLAMA_ROUTER_FLEET (see deploy/fleet.yaml). Do not add a top-level
# `nodes:` key here — that is a hard config error.
#
# Cloud providers: Verda spots and optional RunPod interruptible pods.
# Thunder sections are rejected as unknown fields. Secrets stay in env
# (VERDA_CLIENT_ID / VERDA_CLIENT_SECRET, RUNPOD_API_KEY) — never YAML.
#
# Hourly caps (hard filters on create): Verda `max_spot_price_per_hour`,
# RunPod `max_price_per_hour`. Over-cap offers are never provisioned.
# `verda.demand_scale_price_per_hour` is metrics/log fallback only, not a cap.

# policy:
#   sticky_affinity: false
#   default_max_inflight: 2
#   saturated_retry_after_seconds: 30
#   provision_retry_after_seconds: 30
#   # Opt-in: enqueue a fleet pull when generate/chat/embed miss a model.
#   # Placement-gated (static VRAM/class). Default in router.defaults.yaml is false.
#   auto_pull_on_miss: true
#   pull_miss_retry_after_seconds: 10
#   auto_pull_wait_seconds: 0

# desired_model_tiers:
#   - models:
#       - qwen3-embedding:8b
#       - moondream
#       - llama3.2:1b
#     min_vram_gb: 0

# verda:
#   auto_scale: true
#   auto_scale_min_instances: 0
#   auto_scale_max_instances: 2
#   orphan_reclaim_enabled: true
#   orphan_reclaim_grace_seconds: 1800
#   # Default ranking is best_value (lowest $/known VRAM GiB). Opt into cheapest:
#   # selection_strategy: cheapest
#   # Hard hourly cap (must be > 0 when set); over-cap spots are never created:
#   # max_spot_price_per_hour: 0.50
#   # Billing-period floor before idle teardown (seconds; 0 = none):
#   # min_lifetime_seconds: 0
#   ssh_key_name: ollama-router
#   startup_script_name: ollama-router-agent-init
#   # Reachable enroll URL for Verda spots (not 0.0.0.0). Tokens stay in env:
#   # ZROK_ENABLE_TOKEN, OLLAMA_ROUTER_ADMIN_TOKEN (names below).
#   enroll_url: http://router.example:11435
#   zrok_enable_token_env: ZROK_ENABLE_TOKEN
#   enroll_token_env: OLLAMA_ROUTER_ADMIN_TOKEN
#   # Optional: pin a .deb/tarball instead of the GitHub release for this version.
#   # agent_package_url: https://example.invalid/ollama-node-agent_0.1.0_amd64.deb
#   # Inclusive VRAM window; 80 GB excludes H200-class cards.
#   min_vram_gb: 8
#   max_vram_gb: 80
#   # Optional fallback for demand-scale logs/metrics. FleetState
#   # verda_spot_price_per_hour wins when persisted. Not an create-time cap.
#   demand_scale_price_per_hour: 0.30

# runpod:
#   enabled: false
#   # API key from env named below — never a YAML literal.
#   api_key_env: RUNPOD_API_KEY
#   interruptible: true
#   on_demand_fallback: false
#   cloud_type: SECURE
#   # Default image is ollama/ollama:latest (override to pin a digest or PyTorch).
#   # image: ollama/ollama:latest
#   # template_id: null
#   # preferred_data_centers: [EU-NL-1, EU-FR-1, EU-CZ-1, EU-RO-1, EU-SE-1]
#   # Hard hourly cap (must be > 0 when set):
#   # max_price_per_hour: 0.50
#   min_vram_gb: 8
#   max_vram_gb: 80
#   auto_scale_min_instances: 0
#   auto_scale_max_instances: 2
#   idle_timeout_seconds: 900
#   idle_grace_after_create_seconds: 300
#   min_lifetime_seconds: 0
#   enroll_url: http://router.example:11435
#   zrok_enable_token_env: ZROK_ENABLE_TOKEN
#   enroll_token_env: OLLAMA_ROUTER_ADMIN_TOKEN
#   # Guest-reachable agent package (required until GitHub release assets exist):
#   # agent_package_url: https://example.invalid/ollama-node-agent_0.1.0_amd64.deb

# Self-hosted zrok controller the router `access private` frontends talk to.
# When runpod.enabled, api_endpoint must be guest-reachable http(s) (not loopback).
# Enable token stays in the env named below — never a YAML literal.
# tunnel:
#   api_endpoint: http://zrok.example:18080
#   enable_token_env: ZROK_ENABLE_TOKEN
#   access_bind: "127.0.0.1"
