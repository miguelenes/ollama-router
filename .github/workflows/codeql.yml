name: CodeQL

run-name: "CodeQL · ${{ github.ref_name }} · ${{ github.sha }}"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

# SARIF upload to the Security tab needs a public repo or GitHub Code Security
# on a private repo. Without that license, upload fails the job even when
# analysis succeeds. Set repository variable CODEQL_UPLOAD_ENABLED=true after
# enabling Code Security, or make the repository public.
env:
  CODEQL_SHOULD_UPLOAD: ${{ vars.CODEQL_UPLOAD_ENABLED == 'true' || !github.event.repository.private }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: ${{ matrix.language == 'rust' }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: ${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-sarif
          upload: ${{ env.CODEQL_SHOULD_UPLOAD == 'true' && 'always' || 'never' }}

      - name: Upload SARIF artifact
        if: env.CODEQL_SHOULD_UPLOAD != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: ${{ runner.temp }}/codeql-sarif
          retention-days: 14
          if-no-files-found: warn
