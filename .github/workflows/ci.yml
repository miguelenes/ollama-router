name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: Install cargo-deny and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-llvm-cov

      - name: cargo deny
        run: cargo deny check advisories bans

      - name: coverage (≥80% lines, ignore **/main.rs)
        run: cargo llvm-cov --workspace --locked --fail-under-lines 80 --summary-only --ignore-filename-regex '(^|/)main\.rs$'

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/bake-action@v7
        with:
          source: .
          targets: router
          load: true
          set: |
            router.tags=ollama-router:ci

      - name: Run /healthz
        run: |
          docker run -d --name ollama-router-ci -p 11434:11434 ollama-router:ci
          trap 'docker rm -f ollama-router-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs ollama-router-ci || true
          echo "healthz did not become ready" >&2
          exit 1

  swarm-stack-refs:
    name: Swarm stack refs (no ghcr.io)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The swarmnet deploy path must pull only from the fleet local registry.
      # Any ghcr.io *image ref* in deploy/swarm/ is a spec violation
      # (swarmnet-local-deploy: "Stack image refs are local-registry only").
      # Docs prose about the public package stays fine; only `image:` refs count.
      - name: Stack image refs must exclude ghcr.io
        run: |
          set -euo pipefail
          if grep -rInE '^[[:space:]]*image:[[:space:]]*.*ghcr\.io' \
              --include='*.yml' --include='*.yaml' deploy/swarm/; then
            echo "::error::deploy/swarm image refs must use the fleet local registry only (no ghcr.io)" >&2
            exit 1
          fi

