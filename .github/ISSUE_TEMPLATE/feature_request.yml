name: Feature request
description: Propose a new capability or behavior.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap does this fill? Reference the honest-fleet contract where relevant.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and what user-visible behavior results.
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariant check
      description: Confirm the proposal does not break these.
      options:
        - label: Keeps list = union / infer = holders-only / pull = placement / miss = 503 model_missing
        - label: Keeps one-router-replica (no Redis/HA)
        - label: Keeps cloud URLs tunnel/loopback-only (public_url_blocked)
        - label: No Thunder involvement
