name: Setup Rust
description: Install the pinned Rust toolchain (1.97) and cache cargo deps

inputs:
  components:
    description: Additional rustup components (comma-separated, e.g. "clippy, rustfmt, llvm-tools-preview")
    required: false
    default: ""
  targets:
    description: Additional compilation targets (comma-separated)
    required: false
    default: ""
  cache-key:
    description: Extra cache key suffix for rust-cache
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.97"
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
