# Default agent config (component pkg). This package does not install Ollama;
# run `sudo ollama-node-agent setup` to brew-or-fail Ollama and start the zrok
# sidecar. pkg upgrades replace this yaml (pkgbuild has no conffile/NeverOverwrite).
# Enable: ZROK_API_ENDPOINT + ZROK_ENABLE_TOKEN, then sudo -E ollama-node-agent setup.
# Not a VPN. Do not put tokens in this file.
# Optional test seams (normally unset):
#   OLLAMA_NODE_AGENT_DISCOVERED_V4=192.168.1.10,10.0.0.5  # LAN IP discovery override
#   OLLAMA_NODE_AGENT_WINDOWS_ZIP=1  # Windows only: zip install instead of Setup.exe
listen: loopback
port: 11436
ollama:
  listen: loopback
tunnel:
  enable: true
  zrok_bin: zrok
