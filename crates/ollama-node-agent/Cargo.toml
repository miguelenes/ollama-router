[package]
name = "ollama-node-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Node-local Ollama installer, supervisor, and node agent (:11436)"

[lints.rust]
unsafe_code = "deny"

# Cannot set `lints.workspace = true`: workspace `unsafe_code = "forbid"` cannot
# be allowed for `windows_scm.rs` (`define_windows_service!` FFI thunk). Keep
# clippy levels in lockstep with `[workspace.lints.clippy]`.
[lints.clippy]
all = "deny"
redundant_clone = "deny"
large_enum_variant = "deny"
needless_collect = "deny"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
ollama-capacity-types = { path = "../ollama-capacity-types" }
prometheus.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
noyalib.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["process", "fs", "signal"] }
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
http-body-util.workspace = true
httpmock.workspace = true
tempfile.workspace = true
tower.workspace = true
