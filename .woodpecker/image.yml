# Bake the router image and probe /healthz. Runs on the fleet agent
# (Docker socket), mirroring the old ci.yml "Docker" job.
#
# The container is published to a random high port on loopback
# (127.0.0.1:0 -> 11434) so the probe never collides with a router already
# running on the agent's :11434.

when:
  event: [push, pull_request]

steps:
  - name: bake
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      # type=gha cache (docker-bake.hcl) needs GitHub Actions credentials;
      # override with a workspace-local cache on this substrate.
      - docker buildx bake --target router --load --set "router.tags=ollama-router:ci" --set "*.cache-from=type=local,src=.buildx-cache" --set "*.cache-to=type=local,dest=.buildx-cache,mode=max"

  - name: healthz
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker run -d --name ollama-router-ci -p 127.0.0.1:0:11434 ollama-router:ci
      - trap "docker rm -f ollama-router-ci >/dev/null 2>&1 || true" EXIT
      - PORT=$(docker port ollama-router-ci 11434 | head -n1 | sed "s/.*://")
      - i=0; while [ "$i" -lt 30 ]; do if wget -qO- "http://127.0.0.1:${PORT}/healthz"; then exit 0; fi; i=$((i+1)); sleep 1; done
      - docker logs ollama-router-ci || true
      - echo "healthz did not become ready" >&2
      - exit 1
