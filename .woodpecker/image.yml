# Bake the router image and probe /healthz. Runs on the fleet agent
# (Docker socket), mirroring the old ci.yml "Docker" job.
#
# The probe uses `docker exec` against the container's loopback — not the
# step container's 127.0.0.1 (Woodpecker steps do not share the host netns).
#
# `push` and `manual`: fork PRs are not executed on the Docker-socket host.

when:
  - event: push
  - event: manual

labels:
  role: ci

steps:
  - name: bake
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker buildx bake router --load --set "router.tags=ollama-router:ci" --set "*.cache-from=type=local,src=.buildx-cache" --set "*.cache-to=type=local,dest=.buildx-cache,mode=max"

  - name: healthz
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker rm -f ollama-router-ci >/dev/null 2>&1 || true
      - docker run -d --name ollama-router-ci ollama-router:ci
      - trap "docker rm -f ollama-router-ci >/dev/null 2>&1 || true" EXIT
      - 'i=0; while [ "$$i" -lt 60 ]; do if docker exec ollama-router-ci curl -fsS http://127.0.0.1:11434/healthz; then exit 0; fi; i=$$((i+1)); sleep 1; done'
      - docker logs ollama-router-ci || true
      - echo "healthz did not become ready" >&2
      - exit 1
