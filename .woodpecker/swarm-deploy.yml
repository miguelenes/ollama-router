# Update the live ollama-router Swarm stack from the fleet local registry.
# Replaces the swarm-deploy job of .github/workflows/deploy-swarm.yml.
#
# Deploy is separately gated from registry push: requires BOTH secrets
# FLEET_REGISTRY_PUSH_ENABLED == "true" AND SWARM_DEPLOY_ENABLED == "true".
# Otherwise the steps are skipped and the pipeline stays green.
# DEPLOY_REGISTRY may differ from FLEET_REGISTRY when the push host is
# loopback but swarm nodes must pull via the LAN IP (deploy/swarm/README.md).
#
# CI never writes fleet.yaml; the stack mounts inventory read-only and
# treats secrets as host env / Swarm secrets.
#
# Post-deploy: poll the running Swarm task with `docker exec` + in-container
# curl (same as image.yml). The step container cannot reach host :11434.

when:
  - event: push
    branch: main
  - event: manual

labels:
  role: swarm-manager

depends_on:
  - name: fleet-push
    optional: true

steps:
  - name: swarm-deploy
    image: docker:27
    environment:
      FLEET_REGISTRY_PUSH_ENABLED:
        from_secret: FLEET_REGISTRY_PUSH_ENABLED
      SWARM_DEPLOY_ENABLED:
        from_secret: SWARM_DEPLOY_ENABLED
      FLEET_REGISTRY:
        from_secret: FLEET_REGISTRY
      DEPLOY_REGISTRY:
        from_secret: DEPLOY_REGISTRY
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - set -e
      # Quote: YAML treats `if [` as a flow sequence, not a shell command.
      - 'if [ "$${FLEET_REGISTRY_PUSH_ENABLED:-}" != "true" ] || [ "$${SWARM_DEPLOY_ENABLED:-}" != "true" ]; then echo "deploy gate off: skipping stack update"; exit 0; fi'
      # Runs on the Swarm manager (or a host with DOCKER_HOST pointing at it).
      # The stack file interpolates $${DEPLOY_REGISTRY} / $${ROUTER_TAG} from
      # this step's environment.
      - FLEET_REGISTRY="$${FLEET_REGISTRY:-127.0.0.1:5005}"
      - export DEPLOY_REGISTRY="$${DEPLOY_REGISTRY:-$$FLEET_REGISTRY}"
      - export ROUTER_TAG="sha-$$(echo "$$CI_COMMIT_SHA" | cut -c1-7)"
      - docker stack deploy --prune --with-registry-auth -c deploy/swarm/ollama-router.stack.yml ollama-router
      - docker service ls --filter name=ollama-router_router
      - 'IMG=$$(docker service inspect ollama-router_router --format "{{.Spec.TaskTemplate.ContainerSpec.Image}}"); echo "router image: $$IMG"; case "$$IMG" in *":$${ROUTER_TAG}") ;; *) echo "expected tag $${ROUTER_TAG} in service image" >&2; exit 1;; esac'
      - 'i=0; while [ "$$i" -lt 120 ]; do CID=$$(docker ps -q --filter label=com.docker.swarm.service.name=ollama-router_router --filter status=running | head -1); if [ -n "$$CID" ] && docker exec "$$CID" curl -fsS http://127.0.0.1:11434/healthz; then echo "healthz ok"; exit 0; fi; i=$$((i+1)); sleep 2; done'
      - docker service ps ollama-router_router --no-trunc || true
      - 'CID=$$(docker ps -aq --filter label=com.docker.swarm.service.name=ollama-router_router | head -1); if [ -n "$$CID" ]; then docker logs "$$CID" 2>&1 | tail -80 || true; fi'
      - echo "healthz did not become ready after stack deploy" >&2
      - exit 1
