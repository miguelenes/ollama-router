# Publish the router image to GHCR for public consumers (edge/sha/semver/
# latest tags) and attach build provenance attestation when the repository
# is public. Replaces .github/workflows/docker.yml.
#
# Secrets: REGISTRY_TOKEN (fine-grained PAT, read/write:packages).
# Attestation: buildx provenance manifests, gated on the repository's live
# visibility (queried via the GitHub API with REGISTRY_TOKEN).

when:
  - event: push
    branch: main
  - event: [tag, manual]

steps:
  - name: resolve-visibility
    image: alpine:3.20
    environment:
      REGISTRY_TOKEN:
        from_secret: REGISTRY_TOKEN
    commands:
      - apk add --no-cache curl jq
      - 'VIS=$$(curl -fsS -H "Authorization: Bearer $$REGISTRY_TOKEN" "https://api.github.com/repos/$$CI_REPO" | jq -r .private)'
      - echo "REPO_PRIVATE=$VIS" > vis.env

  - name: publish
    image: docker:27
    environment:
      REGISTRY_TOKEN:
        from_secret: REGISTRY_TOKEN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - set -e
      # visibility from the previous step (shared workspace)
      - . ./vis.env
      - echo "$$REGISTRY_TOKEN" | docker login ghcr.io -u "$$CI_REPO_OWNER" --password-stdin
      - REF="ghcr.io/$$(echo "$$CI_REPO" | tr '[:upper:]' '[:lower:]')"
      - SHA="sha-$$(echo "$$CI_COMMIT_SHA" | cut -c1-7)"
      - TAGS="$SHA"
      - 'if [ "$$CI_COMMIT_EVENT" = "push" ] && [ "$$CI_COMMIT_BRANCH" = "main" ]; then TAGS="edge,$$TAGS"; fi'
      - 'if [ -n "$${CI_COMMIT_TAG:-}" ]; then ver="$${CI_COMMIT_TAG#v}"; major="$${ver%%.*}"; rest="$${ver#*.}"; minor="$${rest%%.*}"; TAGS="$$CI_COMMIT_TAG,$$major,$$major.$$minor,latest,$$TAGS"; fi'
      - IMAGES=""; for t in $$(echo "$$TAGS" | tr ',' ' '); do IMAGES="$$IMAGES,$${REF}:$$t"; done; IMAGES="$${IMAGES#,}"
      - docker buildx bake router --push --set "*.tags=$${IMAGES}" --set "*.cache-from=type=local,src=.buildx-cache" --set "*.cache-to=type=local,dest=.buildx-cache,mode=max"
