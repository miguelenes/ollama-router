# Push the router image to the fleet local registry ONLY (swarm path).
# Never pushes to ghcr.io. Replaces the fleet-registry-push job of
# .github/workflows/deploy-swarm.yml.
#
# Gate: repository secret FLEET_REGISTRY_PUSH_ENABLED == "true"
# (absent or anything else -> steps skipped, pipeline stays green).
# Secrets: FLEET_REGISTRY (push target host, default 127.0.0.1:5005).
# The agent daemon must trust the registry as insecure (see
# deploy/swarm/README.md).

when:
  event: push
  branch: main

steps:
  - name: fleet-push
    image: docker:27
    environment:
      FLEET_REGISTRY_PUSH_ENABLED:
        from_secret: FLEET_REGISTRY_PUSH_ENABLED
      FLEET_REGISTRY:
        from_secret: FLEET_REGISTRY
    when:
      evaluate: 'FLEET_REGISTRY_PUSH_ENABLED == "true"'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - set -e
      - if [ "${FLEET_REGISTRY_PUSH_ENABLED:-}" != "true" ]; then echo "gate off: skipping fleet registry push"; exit 0; fi
      - REG="${FLEET_REGISTRY:-127.0.0.1:5005}"
      - SHA="sha-$(echo "$CI_COMMIT_SHA" | cut -c1-7)"
      - REF="${REG}/ollama-router"
      - IMAGES="${REF}:latest,${REF}:${SHA}"
      # Push only to the fleet local registry. This pipeline never logs in
      # to or pushes ghcr.io; the swarm path is local-registry only (spec
      # swarmnet-local-deploy).
      - docker buildx bake --target router --push --set "*.tags=${IMAGES}" --set "*.cache-from=type=local,src=.buildx-cache" --set "*.cache-to=type=local,dest=.buildx-cache,mode=max"
