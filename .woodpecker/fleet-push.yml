# Push the router image to the fleet local registry ONLY (swarm path).
# Never pushes to ghcr.io. Replaces the fleet-registry-push job of
# .github/workflows/deploy-swarm.yml.
#
# Gate: repository secret FLEET_REGISTRY_PUSH_ENABLED == "true"
# (absent or anything else -> steps skipped, pipeline stays green).
#
# Secrets:
#   FLEET_REGISTRY          primary push host (default 127.0.0.1:5005 on the CI agent)
#   FLEET_REGISTRY_REPLICA  optional second push host (Swarm manager registry LAN,
#                           e.g. 192.168.100.5:5005 when CI agent != manager)
#   DEPLOY_REGISTRY         swarm pull host (swarm-deploy only; usually manager loopback)
#
# Loopback FLEET_REGISTRY requires --builder default (not docker-container swarmos):
# BuildKit's 127.0.0.1 is inside the builder container, not the agent host.
# The agent daemon must trust HTTP registries (see deploy/swarm/README.md).

when:
  - event: push
    branch: main
  - event: manual

labels:
  role: ci

steps:
  - name: fleet-push
    image: docker:27
    environment:
      FLEET_REGISTRY_PUSH_ENABLED:
        from_secret: FLEET_REGISTRY_PUSH_ENABLED
      FLEET_REGISTRY:
        from_secret: FLEET_REGISTRY
      FLEET_REGISTRY_REPLICA:
        from_secret: FLEET_REGISTRY_REPLICA
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - set -e
      # Quote: YAML treats `if [` as a flow sequence, not a shell command.
      - 'if [ "$${FLEET_REGISTRY_PUSH_ENABLED:-}" != "true" ]; then echo "gate off: skipping fleet registry push"; exit 0; fi'
      - REG="$${FLEET_REGISTRY:-127.0.0.1:5005}"
      - REPLICA="$${FLEET_REGISTRY_REPLICA:-}"
      - SHA="sha-$$(echo "$$CI_COMMIT_SHA" | cut -c1-7)"
      - REF="$${REG}/ollama-router"
      - 'if [ -n "$${REPLICA}" ]; then echo "replicating to $${REPLICA}"; docker buildx build --builder default --target router --push -t "$${REF}:latest" -t "$${REF}:$${SHA}" -t "$${REPLICA}/ollama-router:latest" -t "$${REPLICA}/ollama-router:$${SHA}" --cache-from type=local,src=.buildx-cache --cache-to type=local,dest=.buildx-cache,mode=max .; else docker buildx build --builder default --target router --push -t "$${REF}:latest" -t "$${REF}:$${SHA}" --cache-from type=local,src=.buildx-cache --cache-to type=local,dest=.buildx-cache,mode=max .; fi'
