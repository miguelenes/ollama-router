[workspace]
resolver = "2"
members = [
    "crates/ollama-router",
    "crates/ollama-router-core",
    "crates/ollama-router-verda",
    "crates/ollama-mock",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "proprietary"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
clap = { version = "4", features = ["derive", "env"] }
fs4 = "1.1"
http-body-util = "0.1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
futures-util = "0.3"
httpmock = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
russh = "0.62"
md-5 = "0.10"
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"
