[workspace]
resolver = "2"
members = [
    "crates/ollama-router",
    "crates/ollama-router-core",
    "crates/ollama-router-verda",
    "crates/ollama-mock",
    "crates/ollama-capacity-types",
    "crates/ollama-node-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "proprietary"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
clap = { version = "4", features = ["derive", "env"] }
fs4 = "1.1"
http-body-util = "0.1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id"] }
prometheus = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
futures-util = "0.3"
httpmock = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
base64 = "0.22"
secrecy = "0.10"
sha2 = "0.10"
sysinfo = "0.35"
time = { version = "0.3", default-features = false, features = ["formatting", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Match CI `cargo clippy ... -- -D warnings` so rust-analyzer uses the same set.
# Do not enable clippy::pedantic here.
[workspace.lints.clippy]
all = "deny"
redundant_clone = "deny"
large_enum_variant = "deny"
needless_collect = "deny"
