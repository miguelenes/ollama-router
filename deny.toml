# cargo-deny: advisories + bans. Licenses stay light until the workspace exists.
# See AGENTS.md — rustls only; openssl / native-tls are forbidden.
# Do not set [bans].allow — that becomes an exclusive allowlist and fails CI.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # rsa crate still has no constant-time patch. Only reached via russh
    # publickey auth to operator-owned hosts (ed25519 keys in practice).
    { id = "RUSTSEC-2023-0071", reason = "no patched rsa crate; russh-only SSH to operator-owned hosts" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]
